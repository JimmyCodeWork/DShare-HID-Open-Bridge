name: Windows preview build
on:
  workflow_dispatch:
  push:
    branches: [build/windows-preview]
  # Pull requests are built before they are merged, so merging doesn't build the same code again.
  # Release builds come from tags (windows-release.yml); push to main without a pull request and
  # the build can still be started by hand.
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (defaults to the triggering ref).
        type: string
        default: ''
      version-label:
        description: Package version label, with or without a leading "v".
        type: string
        default: ''
      artifact-name:
        description: Name of the uploaded workflow artifact.
        type: string
        default: windows-preview-packages
    outputs:
      artifact-name:
        description: Name of the uploaded workflow artifact.
        value: ${{ jobs.package.outputs.artifact-name }}
permissions:
  contents: read
  id-token: write
  attestations: write
concurrency:
  # A newer push to the same branch or pull request supersedes an in-progress preview build.
  # Release builds are called from windows-release.yml, which has its own non-cancelling
  # concurrency group.
  group: windows-preview-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) }}
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 120
    outputs:
      artifact-name: ${{ steps.meta.outputs.artifact-name }}
    env:
      # Signing is enabled only when a certificate secret is configured.
      # See docs/windows-code-signing.md.
      WINDOWS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
      WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
      WINDOWS_SIGNING_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGNING_TIMESTAMP_URL }}
      # Compiler cache for the project's own sources.
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - name: Resolve package metadata
        id: meta
        shell: pwsh
        env:
          VERSION_LABEL: ${{ inputs.version-label || '0.1.0-alpha.2' }}
          ARTIFACT_NAME: ${{ inputs.artifact-name || 'windows-preview-packages' }}
        run: |
          $label = $env:VERSION_LABEL -replace '^v', ''
          if ($label -notmatch '^[0-9A-Za-z][0-9A-Za-z.+-]*$') { throw "Invalid version label: $label" }
          "version-label=$label" >> $env:GITHUB_OUTPUT
          "artifact-name=$env:ARTIFACT_NAME" >> $env:GITHUB_OUTPUT
          # Single source of truth for the Qt version, shared with run_task.bat.
          $qt = (Get-Content cmake/qt-version.txt -Raw).Trim()
          if ($qt -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid Qt version in cmake/qt-version.txt: $qt" }
          "qt-version=$qt" >> $env:GITHUB_OUTPUT
          if ($env:WINDOWS_SIGNING_CERTIFICATE) {
            Write-Host 'Code signing: enabled'
          } else {
            Write-Host '::notice::Code signing certificate not configured; packages will be unsigned.'
          }
      - uses: ilammy/msvc-dev-cmd@v1
      # Prebuilt Qt and Qt's OpenSSL 3 build; both are cached, so nothing is compiled from source.
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ steps.meta.outputs.qt-version }}
          arch: win64_msvc2022_64
          tools: tools_opensslv3_x64
          cache: true
      - name: Locate OpenSSL
        shell: pwsh
        run: |
          $root = Join-Path $env:IQTA_TOOLS 'OpenSSLv3/Win_x64'
          foreach ($item in 'include/openssl/ssl.h', 'include/openssl/applink.c', 'lib/libssl.lib', 'lib/libcrypto.lib', 'bin') {
            if (-not (Test-Path (Join-Path $root $item))) {
              Get-ChildItem $env:IQTA_TOOLS -Recurse -Depth 3 | Select-Object -ExpandProperty FullName
              throw "OpenSSL package is missing $item under $root"
            }
          }
          "OPENSSL_ROOT_DIR=$root" >> $env:GITHUB_ENV
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Install WiX 4
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.6
          wix extension add --global WixToolset.UI.wixext/4.0.6
          wix extension add --global WixToolset.Util.wixext/4.0.6
          wix extension add --global WixToolset.Firewall.wixext/4.0.6
      - name: Configure
        shell: pwsh
        env:
          VERSION_LABEL: ${{ steps.meta.outputs.version-label }}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" "-DOPENSSL_ROOT_DIR=$env:OPENSSL_ROOT_DIR" -DDSH_CUSTOM_BRIDGE=ON "-DPACKAGE_VERSION_LABEL=$env:VERSION_LABEL" -DBUILD_TESTS=OFF -DBUILD_INSTALLER=ON -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        shell: pwsh
        run: |
          cmake --build build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          sccache --show-stats
      - name: Package
        shell: pwsh
        run: |
          # When a certificate is configured, the CPack pre-build script signs the staged
          # executables and DLLs before they are packed into the ZIP and MSI.
          cmake --build build --target package
          if ($LASTEXITCODE -ne 0) {
            Get-ChildItem build/_CPack_Packages -Filter wix.log -Recurse | ForEach-Object { Get-Content $_.FullName }
            exit 1
          }
          if (-not (Get-ChildItem build/*.msi)) { throw 'No MSI was generated' }
      - name: Sign installer
        if: env.WINDOWS_SIGNING_CERTIFICATE != ''
        shell: pwsh
        run: |
          $msi = @(Get-ChildItem build/*.msi | ForEach-Object FullName)
          ./deploy/windows/Invoke-CodeSigning.ps1 -Required @msi
      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem build/*.msi, build/*.zip | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          }
          # LF line endings so that `sha256sum -c` works on Linux and macOS as well.
          [System.IO.File]::WriteAllText((Join-Path $PWD 'build/SHA256SUMS.txt'), (($lines -join "`n") + "`n"))
          Get-Content build/SHA256SUMS.txt
      - name: Attest build provenance
        # pull requests (in particular from forks) can't get the id-token permission; attest
        # what is built from this repository's branches and tags
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            build/*.msi
            build/*.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ steps.meta.outputs.artifact-name }}
          path: |
            build/*.msi
            build/*.zip
            build/SHA256SUMS.txt
          if-no-files-found: error
